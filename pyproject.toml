[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-based-llm-agent-debugging"
version = "0.1.0"
description = "Interpretable WHO and WHEN localization for multi-agent execution failures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
model-based-debugging = "model_based_debugging.cli:main"

[tool.setuptools.packages.find]
include = ["model_based_debugging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
